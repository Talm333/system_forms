<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Orden Comercial</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
            font-family: 'Inter', sans-serif;
        }
        .form-container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 20px;
        }
        .form-title {
            color: #495057;
            border-bottom: 3px solid #007bff;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .section-title {
            margin-top: 30px;
            margin-bottom: 15px;
            color: #343a40;
            font-size: 1.1rem;
            font-weight: 600;
        }
        .form-label {
            font-weight: 700;
        }
        .btn-group-custom {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            justify-content: flex-end;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="form-container">

        <h2 class="form-title">Orden Comercial</h2>

        <form id="comercialForm" name="comercialForm">

            <div id="form-error-message" class="alert alert-danger" role="alert" style="display:none;"></div>
            <div id="form-success-message" class="alert alert-success" role="alert" style="display:none;"></div>

            <!-- Datos Generales -->
            <div class="section-title">Datos Generales</div>
            <div class="row g-3">

                <div class="col-md-4">
                    <label class="form-label">Número OT</label>
                    <input type="text" class="form-control" readonly>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Fecha</label>
                    <input type="date" class="form-control" readonly>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Proforma N°</label>
                    <input type="text" class="form-control">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Cliente</label>
                    <select class="form-select">
                        <option value="">Seleccionar...</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Destino</label>
                    <select class="form-select">
                        <option value="">Seleccionar...</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Mix</label>
                    <select class="form-select">
                        <option value="">Seleccionar...</option>
                        <option value="1">Sí</option>
                        <option value="0">No</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Tolerancia peso total</label>
                    <select class="form-select">
                        <option value="">Seleccionar...</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Glaseo</label>
                    <select class="form-select">
                        <option value="">Seleccionar...</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Ficha Técnica</label>
                    <input type="text" class="form-control">
                </div>

            </div>

            <!-- Vida útil y logística -->
            <div class="section-title">Vida útil y logística</div>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Vida útil mínima</label>
                    <input type="number" class="form-control">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Vida útil máxima</label>
                    <input type="number" class="form-control">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Fecha de carga</label>
                    <input type="date" class="form-control">
                </div>
            </div>

            <!-- Etiquetas -->
            <div class="section-title">Etiquetas</div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Etiqueta individual</label>
                    <input type="text" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Etiqueta caja</label>
                    <input type="text" class="form-control">
                </div>
            </div>

            <!-- Materia Prima -->
            <div class="section-title">Materia Prima</div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Origen</label>
                    <input type="text" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Lotes</label>
                    <input type="text" class="form-control">
                </div>
            </div>

            <!-- Observación -->
            <div class="section-title">Observación</div>
            <div class="row g-3">
                <div class="col-md-12">
                    <label class="form-label">Observación</label>
                    <textarea class="form-control" rows="3"></textarea>
                </div>
            </div>

            <!-- Ítem -->
            <div class="section-title">Ítem</div>
            <div class="row g-3">
                <div class="col-md-3"><label class="form-label">Especie</label><select class="form-select"><option value="">Seleccionar...</option></select></div>
                <div class="col-md-3"><label class="form-label">Estado</label><select class="form-select"><option value="">Seleccionar...</option></select></div>
                <div class="col-md-3"><label class="form-label">Producto</label><select class="form-select"><option value="">Seleccionar...</option></select></div>
                <div class="col-md-3"><label class="form-label">Calidad</label><select class="form-select"><option value="">Seleccionar...</option></select></div>
                <div class="col-md-3"><label class="form-label">E. Prim</label><select class="form-select"><option value="">Seleccionar...</option></select></div>
                <div class="col-md-3"><label class="form-label">Calibre</label><select class="form-select"><option value="">Seleccionar...</option></select></div>
                <div class="col-md-3"><label class="form-label">Tipo peso</label><select class="form-select"><option value="">Seleccionar...</option></select></div>
                <div class="col-md-3"><label class="form-label">% Glaseo</label><select class="form-select"><option value="">Seleccionar...</option></select></div>
            </div>

            <!-- Empaque Secundario -->
            <div class="section-title">Empaque Secundario</div>
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Total cajas</label>
                    <input type="number" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Tipo caja</label>
                    <select class="form-select"><option value="">Seleccionar...</option></select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Peso x ítem</label>
                    <input type="number" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Tolerancia</label>
                    <select class="form-select"><option value="">Seleccionar...</option></select>
                </div>
            </div>

            <div class="btn-group-custom">
                <button type="button" class="btn btn-secondary">Cerrar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>

        </form>

    </div>
</div>

</body>
</html>
