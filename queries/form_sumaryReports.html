<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Consultas - Informes Resúmenes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
            font-family: 'Inter', sans-serif;
        }
        .form-container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 20px;
        }
        .form-title {
            color: #495057;
            border-bottom: 3px solid #007bff;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .form-label {
            font-weight: 700;
        }
        .btn-group-custom {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            justify-content: flex-end;
        }
        .report-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            justify-content: flex-end;
            align-items: end;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="form-container">

        <h2 class="form-title">Informes Resúmenes</h2>

        <form id="consultasForm" name="consultasForm">

            <div class="row g-3">

                <!-- Selects -->
                <div class="col-md-3"><label class="form-label">Línea Proceso</label><select class="form-select"><option value="">Seleccionar...</option></select></div>
                <div class="col-md-3"><label class="form-label">Corte</label><select class="form-select"><option value="">Seleccionar...</option></select></div>
                <div class="col-md-3"><label class="form-label">Conservación</label><select class="form-select"><option value="">Seleccionar...</option></select></div>
                <div class="col-md-3"><label class="form-label">Especie</label><select class="form-select"><option value="">Seleccionar...</option></select></div>

                <div class="col-md-3"><label class="form-label">Cliente</label><select class="form-select"><option value="">Seleccionar...</option></select></div>
                <div class="col-md-3"><label class="form-label">Proveedor</label><select class="form-select"><option value="">Seleccionar...</option></select></div>
                <div class="col-md-3"><label class="form-label">Empresa</label><select class="form-select"><option value="">Seleccionar...</option></select></div>
                <div class="col-md-3"><label class="form-label">Lote</label><select class="form-select"><option value="">Seleccionar...</option></select></div>

                <div class="col-md-3"><label class="form-label">OT</label><select class="form-select"><option value="">Seleccionar...</option></select></div>
                <div class="col-md-3"><label class="form-label">Calidad</label><select class="form-select"><option value="">Seleccionar...</option></select></div>
                <div class="col-md-3"><label class="form-label">Calibre</label><select class="form-select"><option value="">Seleccionar...</option></select></div>
                <div class="col-md-3"><label class="form-label">Embarque</label><select class="form-select"><option value="">Seleccionar...</option></select></div>

                <div class="col-md-3"><label class="form-label">Bodega</label><select class="form-select"><option value="">Seleccionar...</option></select></div>

                <!-- Inputs adicionales -->
                <div class="col-md-3"><label class="form-label">N° de Pallet</label><input type="number" class="form-control"></div>
                <div class="col-md-3"><label class="form-label">Rack</label><input type="number" class="form-control"></div>
                <div class="col-md-3"><label class="form-label">Sector</label><input type="text" class="form-control"></div>

                <div class="col-md-3"><label class="form-label">Fecha Inicio</label><input type="date" class="form-control"></div>
                <div class="col-md-3"><label class="form-label">Fecha Término</label><input type="date" class="form-control"></div>
                <div class="col-md-3"><label class="form-label">N° Caja General</label><input type="number" class="form-control"></div>

            </div>

            <!-- Botones de filtro -->
            <div class="btn-group-custom">
                <button type="reset" class="btn btn-secondary">Limpiar</button>
                <button type="submit" class="btn btn-primary">Buscar</button>
            </div>

            <!-- Reporte y Formato ABAJO -->
            <div class="report-group">

                <div>
                    <label class="form-label">Reporte</label>
                    <select class="form-select" name="reporte">
                        <option value="">Seleccionar...</option>
                    </select>
                </div>

                <div>
                    <label class="form-label">Formato</label>
                    <select class="form-select" name="formato">
                        <option value="">Seleccionar...</option>
                        <option value="pdf">PDF</option>
                        <option value="excel">Excel</option>
                    </select>
                </div>

                <div>
                    <button type="button" class="btn btn-success">
                        Ver Informe
                    </button>
                </div>

            </div>

        </form>

    </div>
</div>

</body>
</html>
