<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Impresión Etiqueta Caja</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
            font-family: 'Inter', sans-serif;
        }
        .form-container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 20px;
        }
        .form-title {
            color: #495057;
            border-bottom: 3px solid #007bff;
            padding-bottom: 15px;
            margin-bottom: 25px;
            font-weight: 700;
        }
        .form-label {
            font-weight: 700;
        }
        .btn-group-custom {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            justify-content: flex-end;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="form-container">

        <h2 class="form-title">Reimprimir Etiquetas TXT</h2>

        <form id="etiquetaCajaForm" name="etiquetaCajaForm" enctype="multipart/form-data">

            <!-- Contenedores de mensajes -->
            <div id="form-error-message" class="alert alert-danger" role="alert" style="display: none;"></div>
            <div id="form-success-message" class="alert alert-success" role="alert" style="display: none;"></div>

            <div class="row g-3">

                <div class="col-md-4">
                    <label for="etiqueta" class="form-label">Etiqueta</label>
                    <select id="etiqueta" name="etiqueta" class="form-select">
                        <option value="">Seleccionar...</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label for="archivoTxt" class="form-label">Archivo Texto</label>
                    <input type="file" id="archivoTxt" name="archivoTxt" class="form-control" accept=".txt">
                </div>

                <div class="col-md-4">
                    <label for="puertoImpresora" class="form-label">Puerto Impresora</label>
                    <select id="puertoImpresora" name="puertoImpresora" class="form-select">
                        <option value="">Seleccionar...</option>
                    </select>
                </div>

            </div>

            <div class="btn-group-custom">
                <button type="button" class="btn btn-secondary">Cerrar</button>
                <button type="submit" class="btn btn-primary">Imprimir</button>
            </div>

        </form>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
