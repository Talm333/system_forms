<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
            font-family: 'Inter', sans-serif;
        }
        .form-container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 20px;
        }
        .form-title {
            color: #495057;
            border-bottom: 3px solid #007bff;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .form-label {
            font-weight: 700;
        }
        .btn-group-custom {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            justify-content: flex-end;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="form-container">
            <h2 class="form-title">Usuarios</h2>

            <form id="usersForm" name="usersForm">

                <input type="hidden" name="cod_users" id="cod_users" value="">

                <div id="form-error-message" class="alert alert-danger" role="alert" style="display: none;"></div>
                <div id="form-success-message" class="alert alert-success" role="alert" style="display: none;"></div>

                <div class="row g-3">

                    <div class="col-md-6">
                        <label for="" class="form-label">Nombre Usuario</label>
                        <input type="text" class="form-control" id="" name="">
                    </div>

                    <div class="col-md-6">
                        <label for="" class="form-label">Apellido Usuario</label>
                        <input type="text" class="form-control" id="" name="">
                    </div>

                    <div class="col-md-6">
                        <label for="" class="form-label">Login Usuario</label>
                        <input type="text" class="form-control" id="" name="">
                    </div>

                    <div class="col-md-6">
                        <label for="" class="form-label">Clave</label>
                        <input type="password" class="form-control" id="" name="">
                    </div>

                    <div class="col-md-6">
                        <label for="" class="form-label">Rol</label>
                        <select class="form-select" id="" name="">
                            <option value="">Seleccionar...</option>
                        </select>
                    </div>

                </div>

                <div class="btn-group-custom">
                    <button type="button" class="btn btn-secondary">Cerrar</button>
                    <button type="submit" class="btn btn-primary">Guardar Usuario</button>
                </div>

            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
