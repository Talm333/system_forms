<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .form-container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 20px;
        }
        .form-title {
            color: #495057;
            border-bottom: 3px solid #007bff;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .btn-group-custom {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            justify-content: flex-end;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="form-container">

                    </div>

                    <div class="col-md-4">
                        <label for="" class="form-label">Proceso</label>
                        <select class="form-select" id="" name="">
                            <option value="">Seleccionar...</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="" class="form-label">Cliente</label>
                        <select class="form-select" id="" name="">
                            <option value="">Seleccionar...</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="" class="form-label">Especie</label>
                        <select class="form-select" id="" name="">
                            <option value="">Seleccionar...</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="" class="form-label">Corte</label>
                        <select class="form-select" id="" name="">
                            <option value="">Seleccionar...</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="" class="form-label">Conservación</label>
                        <select class="form-select" id="" name="">
                            <option value="">Seleccionar...</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="" class="form-label">Familia</label>
                        <select class="form-select" id="" name="">
                            <option value="">Seleccionar...</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="" class="form-label">Calidad</label>
                        <select class="form-select" id="" name="">
                            <option value="">Seleccionar...</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="" class="form-label">Calibre</label>
                        <select class="form-select" id="" name="">

                    </div>

                    <div class="col-md-4">

                    <div class="col-md-4">

                        <select class="form-select" id="" name="">
                            <option value="">Seleccionar...</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="" class="form-label">Producto SERNAP</label>
                        <select class="form-select" id="" name="">

                        <input type="number" class="form-control" id="" name="">
                    </div>

                    <div class="col-md-4">
                        <label for="" class="form-label">Piezas Max</label>
                        <input type="number" class="form-control" id="" name="">

                        <select class="form-select" id="" name="">
                            <option value="">Seleccionar...</option>

                </div>

                <div class="btn-group-custom">
                    <button type="reset" class="btn btn-secondary">Limpiar</button>
                    <button type="button" class="btn btn-warning">Editar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
