<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Orden de Embarque</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
            font-family: 'Inter', sans-serif;
        }
        .form-container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 20px;
        }
        .form-title {
            color: #495057;
            border-bottom: 3px solid #007bff;
            padding-bottom: 15px;
            margin-bottom: 25px;
            font-weight: 700;
        }
        .form-label {
            font-weight: 700;
        }
        .btn-group-custom {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            justify-content: flex-end;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="form-container">

        <h2 class="form-title">Orden de Embarque</h2>

        <form id="ordenEmbarqueForm" name="ordenEmbarqueForm">

            <div id="form-error-message" class="alert alert-danger" role="alert" style="display:none;"></div>
            <div id="form-success-message" class="alert alert-success" role="alert" style="display:none;"></div>

            <div class="row g-3">

                <div class="col-md-4">
                    <label class="form-label">Clientes</label>
                    <select class="form-select"></select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">País Destino</label>
                    <select class="form-select"></select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Fecha Despacho</label>
                    <input type="date" class="form-control">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Embarque Directo</label>
                    <select class="form-select">
                        <option>Sí</option>
                        <option>No</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">N° Factura</label>
                    <input type="number" class="form-control">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Estado</label>
                    <select class="form-select"></select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Motivo de Salida</label>
                    <select class="form-select"></select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Tipo Despacho</label>
                    <select class="form-select"></select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Frigorífico Destino</label>
                    <select class="form-select"></select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">N° Guía Maquila SG</label>
                    <input type="number" class="form-control">
                </div>

                <div class="col-md-4">
                    <label class="form-label">N° Guía Cliente</label>
                    <input type="number" class="form-control">
                </div>

                <div class="col-md-4">
                    <label class="form-label">N° Contenedor</label>
                    <input type="number" class="form-control">
                </div>

                <div class="col-md-4">
                    <label class="form-label">N° Patente</label>
                    <input type="text" class="form-control">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Rut Conductor</label>
                    <input type="text" class="form-control">
                </div>

                <div class="col-md-4">
                    <label class="form-label">N° Sello</label>
                    <input type="text" class="form-control">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Texto 1</label>
                    <input type="number" class="form-control">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Texto 2</label>
                    <input type="text" class="form-control">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Texto 3</label>
                    <input type="text" class="form-control">
                </div>

            </div>

            <div class="btn-group-custom">
                <button type="button" class="btn btn-secondary">Cerrar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>

        </form>

    </div>
</div>
</body>
</html>
